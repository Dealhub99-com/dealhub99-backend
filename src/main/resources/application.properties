# Application configuration
spring.application.name=dealhub99-backend

# Active profile (set to 'prod' in production via environment variable SPRING_PROFILES_ACTIVE=prod)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}

# Database configuration
# In production, set DB_URL, DB_USERNAME, DB_PASSWORD as environment variables on Render
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/dealhub99_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Manu@9965}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Security JWT
# In production, set JWT_SECRET as environment variable on Render
dealhub99.app.jwtSecret=${JWT_SECRET:dealhub99SecretKeyForGeneratingJWTTokenItsShouldBeLongEnoughForSecurityReasons1234567890}
dealhub99.app.jwtExpirationMs=86400000

# Mail Configuration
# In production, set MAIL_USERNAME and MAIL_PASSWORD as environment variables on Render
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:mankemanjunath@gmail.com}
spring.mail.password=${MAIL_PASSWORD:lzqr nqnc njlg imke}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Logging (reduced for production)
logging.level.org.springframework.security=${LOG_LEVEL:INFO}

# File Upload Size Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Server port (Render sets PORT env variable)
server.port=${PORT:8080}

# CORS - allow production frontend
dealhub99.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
