# Production profile - activated when SPRING_PROFILES_ACTIVE=prod
# This file overrides application.properties values for production

# Disable SQL debug logging in production
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.highlight_sql=false

# Connection pool settings for Render (limited memory)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Logging in production - reduce noise
logging.level.org.springframework.security=WARN
logging.level.com.dealhub99=INFO
logging.level.org.hibernate=WARN

# Use connection URL for Aiven (SSL required)
# Aiven MySQL requires SSL - add sslMode=REQUIRED to DB_URL
